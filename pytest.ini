[pytest]
# testpaths matters here: this repo's Python is thirteen files, and without it
# pytest collects from the root and picks up whatever untracked scratch sits in
# a working tree -- which is how a stale workflows/local_test.py broke
# collection after the 2026-08-19 prune.
testpaths = tests
python_files = test_*.py
addopts =
    -q
    --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
