scenario_id: "diagnosis_bounds"

scenario_context: |
  Auxiliary untreated natural-history run used only to learn which diagnosis
  diameters are reachable between 120 days and 20 years.

sim_config:
  start_time: 0
  stop_time: 7300
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  initialization_function: "evolve_to_diagnosis"

dosing:
  drugs: []

indication: "PDAC"

notes: |
  Preprocessing only. This scenario is not a calibration or treatment arm.
