scenario_id: "gvax_nivo_urelumab_neoadjuvant_heumann2023"

scenario_context: |
  Neoadjuvant GVAX + low-dose cyclophosphamide + nivolumab + urelumab (anti-CD137/
  4-1BB agonist) in resectable PDAC — Heumann 2023 Nat Commun 14:3650 (NCT02451982
  Arm C / J1568; DOI 10.1038/s41467-023-39196-9, PMID 37339979). All three arms
  share the same priming structure: per dose Day1 Cy 200 mg/m^2 [A,B,C] + nivolumab
  [B,C] + urelumab 8 mg IV [C only]; Day2 GVAX. The immune readouts (mIHC CD8
  densities, CD8+CD137+ fraction) are taken from the surgically resected tumor
  after priming #1 (intact diagnosis tumor, ~day 14-21), so this scenario mirrors
  the existing *_neoadjuvant_zheng2022 structure (evolve_to_diagnosis, single
  priming, stop ~21-30). Arm C is the only arm with a DFS/OS separation signal
  (HR 0.55, p=0.24) and the only one carrying the CD137 axis.

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 30  # Surgery at day 21; extended to 30 for solver stability through the nivo/urelumab stiff transient
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  # Initialization: evolve from healthy state to diagnosis (target diameter from variant)
  initialization_function: 'evolve_to_diagnosis'

# Dosing configuration - passed to schedule_dosing()
dosing:
  drugs: ["GVAX", "nivolumab", "urelumab", "cyclophosphamide"]
  # Override defaults from schedule_dosing.m
  GVAX_dose: 5.0e+8  # cells
  GVAX_schedule: [7, 0, 1]  # [start, interval, repeat] - single dose
  nivolumab_dose: 3.43  # mg/kg (240mg / 70kg)
  nivolumab_schedule: [7, 0, 1]  # single dose
  urelumab_dose: 0.1143  # mg/kg (8 mg flat / 70 kg); anti-CD137/4-1BB agonist
  urelumab_schedule: [7, 0, 1]  # single dose, co-administered with GVAX/nivo
  cyclophosphamide_dose: 380  # mg (200 mg/m^2 × 1.9 m^2 BSA; low-dose immunomodulatory)
  cyclophosphamide_schedule: [6, 0, 1]  # day 6 — one day before GVAX/nivo/urelumab
  patientWeight: 70
  patientBSA: 1.9

# Cancer type
indication: "PDAC"

# Notes
notes: |
  Neoadjuvant Arm C - calibration targets are immune cell ratios and activation
  states at day 21 (surgical resection), not tumor shrinkage. The arm-defining
  readout is the CD8+CD137+ fraction of within-TLA CD8 (Heumann Fig 5b): Arm A
  (GVAX) / Arm B (GVAX+nivo) / Arm C (+urelumab) = 1.5% / 0.6% / 82.7%. The ~140x
  jump over Arm B is the load-bearing CD137 signal.

  TLA compartment: the model now represents tertiary lymphoid aggregates directly
  (tla_module.m), with within-TLA CD8 sub-pools CD8_TLA (resting / CD137-) and
  CD8_TLA_act (CD137+ activated). Urelumab is owned entirely by this module: it
  distributes to V_T.aCD137 and drives CD8_TLA -> CD8_TLA_act via the Hill
  H_CD137_T = V_T.aCD137 / (V_T.aCD137 + CD137_50). The within-TLA target is
  matched directly as CD8_TLA_act / (CD8_TLA + CD8_TLA_act) at day 21 — no
  bulk-proxy workaround is needed. A cross-arm invariance target
  (calibration_targets/cross_scenario/cd8_intla_number_invariance_nivo_vs_urelumab.yaml)
  pins the within-TLA CD8 NUMBER flat from Arm B to C (C/B ratio ~1.0), so urelumab
  is constrained to flip activation state rather than recruit cells.

  CD137 axis is submodel-anchored, not prior-only: the retired N_div_CD137
  division-destiny term was replaced by CD137_50 and k_CD137_act, both constrained
  by submodel targets (calibration_targets/submodel_targets/CD137_50_PDAC_deriv001.yaml,
  k_CD137_act_PDAC_deriv001.yaml).
